# Instalacion automatica de Debian 13 para el portarretrato (se usa con Ventoy).
# __PLACEHOLDERS__ se reemplazan al preparar el pendrive. NO subir a git con datos reales.
# ATENCION: borra el disco interno de la PC (el primero que no sea USB) sin preguntar.

d-i debian-installer/locale string es_AR.UTF-8
d-i debian-installer/language string es
d-i debian-installer/country string AR
d-i keyboard-configuration/xkb-keymap select latam

# Red por cable (DHCP). Si hay varias placas toma la primera con enlace.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string portaretrato
d-i netcfg/get_domain string local
d-i netcfg/hostname string portaretrato
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Usuario "frame" (sin root; usa sudo)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Portaretrato
d-i passwd/username string frame
d-i passwd/user-password password __PASSWORD__
d-i passwd/user-password-again password __PASSWORD__
d-i user-setup/allow-password-weak boolean true

d-i clock-setup/utc boolean true
d-i time/zone string America/Argentina/Buenos_Aires
d-i clock-setup/ntp boolean true

# Disco: el primero que NO sea USB ni removible (asi nunca se borra el pendrive)
d-i partman/early_command string \
    DISK=""; \
    for d in /sys/block/*; do \
        n=${d##*/}; \
        case "$n" in loop*|ram*|sr*|dm-*|md*|zram*|fd*) continue;; esac; \
        [ "$(cat $d/removable 2>/dev/null)" = "0" ] || continue; \
        case "$(readlink -f $d)" in *usb*) continue;; esac; \
        DISK="/dev/$n"; break; \
    done; \
    if [ -n "$DISK" ]; then \
        debconf-set partman-auto/disk "$DISK"; \
        debconf-set grub-installer/bootdev "$DISK"; \
    fi
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Sistema minimo
tasksel tasksel/first multiselect
d-i pkgsel/include string openssh-server sudo git curl ca-certificates php-cli php-curl php-mbstring
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

# Datos del hosting (en base64 para que ningun caracter raro del token rompa el shell)
d-i preseed/late_command string     in-target sh -c "echo __ENV_B64__ | base64 -d > /root/pr.env; chmod 600 /root/pr.env";     in-target git clone --depth 1 https://github.com/Procer/PortaRetrato.git /opt/portaretrato;     in-target bash /opt/portaretrato/instalacion-portarretrato/linux/configurar.sh

d-i finish-install/reboot_in_progress note
